name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test with race detector
        run: go test -race ./...
      - name: Verify translations and generated accessors
        run: |
          make i18n
          make generate
          git diff --exit-code -- locales/catalog_gen.go
      - name: Local swarm integration with race detector
        run: go test -race -tags integration ./internal/torrent -count=1 -timeout=60s
      - name: Vet Go and native UI
        run: |
          go vet ./...
          go tool mygo vet
      - name: Compile Windows and Linux
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o build/rivu.exe .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o build/rivu-linux .
      - name: Build macOS app
        run: go tool mygo build -skip-dmg
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-builds
          path: build/

  native-storage:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify native storage, session and networking
        run: go test ./internal/files ./internal/config ./internal/storage ./internal/session ./internal/torrent ./internal/netproxy ./internal/updater
      - name: Verify local swarm transfers
        run: go test -tags integration ./internal/torrent -count=1 -timeout=60s
