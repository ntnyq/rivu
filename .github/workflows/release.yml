name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v (for example, 0.0.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Require update signing key
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo 'Missing repository secret MYGO_UPDATER_PRIVATE_KEY; refusing an unsigned release.' >&2
            exit 1
          fi
      - name: Prepare version and changelog
        run: |
          python3 <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit("Use a stable version such as 0.0.1, without v.")
          tag = "v" + version
          if git("tag", "--list", tag):
              raise SystemExit(f"Tag {tag} already exists; refusing to overwrite it.")
          branch = os.environ["RELEASE_BRANCH"]
          remote_head = git("ls-remote", "origin", f"refs/heads/{branch}").split()[0]
          if remote_head != git("rev-parse", "HEAD"):
              raise SystemExit("The default branch has changed; start a new workflow run.")

          config_path = pathlib.Path("mygo.json")
          config = json.loads(config_path.read_text())
          if tuple(map(int, version.split("."))) < tuple(map(int, config["version"].split("."))):
              raise SystemExit("The release version cannot be lower than mygo.json.")
          source_path = pathlib.Path("internal/app/run.go")
          source, count = re.subn(r'^const version = "[^"\n]+"$', f'const version = "{version}"', source_path.read_text(), flags=re.MULTILINE)
          if count != 1:
              raise SystemExit("Expected exactly one version constant in internal/app/run.go.")

          tags = git("tag", "--merged", "HEAD", "--sort=-version:refname").splitlines()
          previous = next((value for value in tags if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", value)), None)
          if previous and tuple(map(int, version.split("."))) <= tuple(map(int, previous[1:].split("."))):
              raise SystemExit("The release version must be newer than the previous tag.")
          commits = git("log", "--reverse", "--no-merges", "--format=%h%x09%s", f"{previous}..HEAD" if previous else "HEAD")
          if not commits:
              raise SystemExit("There are no commits to release.")
          visible = re.compile(r"^(feat|fix|refactor)(\([^()\n]+\))?!?:\s+\S")
          changes = []
          for commit in commits.splitlines():
              sha, _, subject = commit.partition("\t")
              if visible.match(subject):
                  changes.append(f"- {subject} ({sha})")
          changes = "\n".join(changes)
          if not changes:
              changes = "No user-facing changes in this release."
          date = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          notes = f"## {version} ({date})\n\n{changes}\n"
          if previous:
              url = f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}'
              notes += f"\n[Full Changelog]({url}/compare/{previous}...{tag})\n"
          changelog_path = pathlib.Path("CHANGELOG.md")
          changelog = changelog_path.read_text() if changelog_path.exists() else "# Changelog\n"
          if not changelog.startswith("# Changelog\n"):
              raise SystemExit("CHANGELOG.md must start with '# Changelog'.")

          config["version"] = version
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n")
          source_path.write_text(source)
          history = changelog.removeprefix("# Changelog\n").lstrip()
          changelog_path.write_text("# Changelog\n\n" + notes + ("\n" + history if history else ""))
          pathlib.Path("RELEASE_NOTES.md").write_text(notes)
          PY
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test with race detector
        run: go test -race ./...
      - name: Verify translations and generated accessors
        run: |
          make i18n
          make generate
          git diff --exit-code -- locales/catalog_gen.go
      - name: Local swarm integration
        run: make integration
      - name: Vet Go and native UI
        run: |
          go vet ./...
          go tool mygo vet
      - uses: actions/upload-artifact@v7
        with:
          name: release-source
          path: |
            internal/app/run.go
            mygo.json
            CHANGELOG.md
            RELEASE_NOTES.md
          if-no-files-found: error

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            target: darwin-universal
          - os: windows-latest
            platform: windows/amd64
            target: windows-amd64
          - os: ubuntu-24.04
            platform: linux/amd64
            target: linux-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-source
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release package
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "$BUILD_PLATFORM"
      - name: Verify and collect signed release assets
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: go run ./tools/releaseassets -target "$BUILD_TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: release-package-${{ matrix.target }}
          path: build/release/
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-source
      - uses: actions/download-artifact@v8
        with:
          pattern: release-package-*
          path: build/release
          merge-multiple: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify combined update assets before tagging
        run: |
          for target in darwin-universal windows-amd64 linux-amd64; do
            go run ./tools/releaseassets -target "$target" -source build/release
          done
      - name: Prepare release notes and checksums
        run: |
          cp RELEASE_NOTES.md build/release/
          cd build/release
          sha256sum ./* > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-v${{ inputs.version }}
          path: build/release/
          if-no-files-found: error
      - name: Commit version and create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/app/run.go mygo.json CHANGELOG.md
          git commit -m "chore: release v${RELEASE_VERSION}"
          git tag -a "v${RELEASE_VERSION}" -m "Release v${RELEASE_VERSION}"
          git push --atomic origin "HEAD:refs/heads/${RELEASE_BRANCH}" "refs/tags/v${RELEASE_VERSION}"
      - name: Create GitHub Release and upload assets
        run: |
          gh release create "v${RELEASE_VERSION}" build/release/* \
            --verify-tag --draft \
            --title "v${RELEASE_VERSION}" \
            --notes-file RELEASE_NOTES.md
